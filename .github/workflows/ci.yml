name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish the image to GitHub Container Registry
    env:
      # The image is published only from the main branch.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: "Frontend: install"
        working-directory: frontend
        run: npm ci

      - name: "Frontend: check formatting"
        working-directory: frontend
        run: npm run format:check

      - name: "Frontend: lint"
        working-directory: frontend
        run: npm run lint

      - name: "Frontend: test"
        working-directory: frontend
        run: npm test

      # Also type-checks. The result, frontend/dist, goes into the jar in the next step.
      - name: "Frontend: build"
        working-directory: frontend
        run: npm run build

      # Needs Docker, which GitHub's runners have: jOOQ code is generated from a throwaway
      # PostgreSQL, and the tests use one too.
      - name: "Backend: build and test"
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image's name (in lower case, as registries require) and its tags:
      # "latest", plus one named after the commit so an older version can be run again.
      - name: Work out image tags
        id: image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-buildx-action@v4

      # On other branches the image is still built, to prove the Dockerfile works, but not published.
      - name: Build the image, and publish it from main
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
