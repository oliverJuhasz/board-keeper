# Settings for running a command, such as --reset-link-for, instead of serving Board Keeper.
# BoardKeeperApplication switches this profile on when it is started with a command's option.

# The command starts the whole application, which includes a web server. Any free port will do,
# so that the command can also run inside the container of the running application.
server.port=0

# Events left over are for the running application to hand out again, not for a command that is
# over in a moment.
spring.modulith.events.republish-outstanding-events-on-restart=false
