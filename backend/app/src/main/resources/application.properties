spring.application.name=board-keeper

# The database connection comes from the environment: SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.

# Describe errors in the standard "problem details" JSON format (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Only /api is the application's API; everything else is the frontend or tooling.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json

# Of the operational endpoints under /actuator, publish only the health check.
management.endpoints.web.exposure.include=health
