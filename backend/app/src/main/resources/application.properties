spring.application.name=board-keeper

# The database connection comes from the environment: SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.

# Describe errors in the standard "problem details" JSON format (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Only /api is the application's API; everything else is the frontend or tooling.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json

# Of the operational endpoints under /actuator, publish only the health check.
management.endpoints.web.exposure.include=health

# Leave out what has no value, instead of sending "null". In the API, absent means none.
spring.jackson.default-property-inclusion=non_null

# Signed-in sessions live in PostgreSQL (ADR 0013). Flyway creates the tables, not Spring Session.
spring.session.jdbc.initialize-schema=never
# How long a session lasts without a visit, unless "Stay signed in" was chosen (then 90 days).
spring.session.timeout=12h

# Every installation of Board Keeper is meant to sit behind a reverse proxy that handles HTTPS
# (docs/self-hosting.md). The proxy's X-Forwarded-* headers tell the application that the original
# request was secure, so the session cookie is marked "Secure". The headers are believed only from
# private-network addresses (such as 127.x, 10.x, 172.16-31.x and 192.168.x) and ignored from
# anywhere else, so without a proxy nothing changes. An installation can override this with
# environment variables: SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES sets the addresses to believe, and
# SERVER_FORWARDHEADERSSTRATEGY=none ignores the headers altogether.
server.forward-headers-strategy=native

# Events between modules (ADR 0011). Spring Modulith stores each event until its listeners have
# handled it, then deletes it, and hands out events left over at the next start.
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true

# The address Board Keeper is reached at, such as https://boardkeeper.example.com, from the
# BOARDKEEPER_URL environment variable. Passkeys belong to one address, so they need it; without it
# they are off. Spring Boot reads BOARDKEEPER_URL into boardkeeper.url by itself.
boardkeeper.url=

# Where this copy of Board Keeper keeps its source code, for the links on the About page. The AGPL asks
# whoever runs a changed copy of Board Keeper for others to offer them its source (ADR 0016), so such a
# copy points these at its own code, for example with the BOARDKEEPER_SOURCE_REPOSITORY,
# BOARDKEEPER_SOURCE_URL and BOARDKEEPER_SOURCE_RELEASES environment variables.
# - repository: the repository's own page. Left empty, the About page has no such link.
# - url: the source code of the running version; {commit} is the commit the build was made from.
# - releases: what is new in a release; {version} is the release, such as 1.2.3. Left empty, the About
#   page has no such link.
boardkeeper.source.repository=https://github.com/oliverJuhasz/board-keeper
boardkeeper.source.url=https://github.com/oliverJuhasz/board-keeper/tree/{commit}
boardkeeper.source.releases=https://github.com/oliverJuhasz/board-keeper/releases/tag/{version}
