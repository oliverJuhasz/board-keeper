# Settings for the tests and for running the application while developing (spring-boot:test-run).
# Spring Boot reads config/application.properties as well as application.properties, and this file
# wins where both set something. A test copy of application.properties itself would replace the
# main one instead.

# Passkeys need the address the browser uses. While developing, that is Vite's server, which
# passes the API calls on to Spring Boot.
boardkeeper.url=http://localhost:5173
