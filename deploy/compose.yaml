# An example of running Board Keeper with Docker Compose: the application and its database.
#
#   1. Copy .env.example to .env and set your own values.
#   2. docker compose up -d
#
# Board Keeper then answers on http://localhost:8080 (or the port you chose). It expects to
# sit behind a reverse proxy that handles HTTPS; setting one up is specific to your installation.

name: board-keeper

services:
  app:
    image: ${BOARD_KEEPER_IMAGE:-ghcr.io/oliverjuhasz/board-keeper:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/boardkeeper
      SPRING_DATASOURCE_USERNAME: boardkeeper
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${BOARD_KEEPER_PORT:-8080}:8080"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardkeeper
      POSTGRES_USER: boardkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # All of Board Keeper's data lives here. From PostgreSQL 18 on, the official image
      # keeps its data under /var/lib/postgresql (older versions used /var/lib/postgresql/data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username boardkeeper --dbname boardkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
